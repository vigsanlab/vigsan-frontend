<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080F"/>
      <stop offset="55%" stop-color="#0C1228"/>
      <stop offset="100%" stop-color="#101838"/>
    </linearGradient>
    <linearGradient id="saffron3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="saffronH3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="blue3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2D5E"/>
      <stop offset="100%" stop-color="#2A4E9A"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3080"/>
      <stop offset="100%" stop-color="#0E1840"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C1635"/>
      <stop offset="100%" stop-color="#060C1E"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A068"/>
      <stop offset="100%" stop-color="#B87840"/>
    </linearGradient>
    <radialGradient id="orbBlue3" cx="75%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#3B9BE8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3B9BE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbSaff3" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <filter id="houseShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="chipShadow3">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="personShadow">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowSaff3">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF6B00" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="560" height="400" fill="url(#bg3)"/>
  <rect width="560" height="400" fill="url(#orbBlue3)"/>
  <rect width="560" height="400" fill="url(#orbSaff3)"/>

  <!-- Geometric lines -->
  <line x1="0" y1="0" x2="200" y2="400" stroke="rgba(255,107,0,0.035)" stroke-width="1.5"/>
  <line x1="560" y1="0" x2="360" y2="400" stroke="rgba(59,155,232,0.035)" stroke-width="1.5"/>
  <line x1="0" y1="400" x2="560" y2="150" stroke="rgba(255,107,0,0.02)" stroke-width="1"/>

  <!-- Top saffron bar -->
  <rect x="0" y="0" width="560" height="3" fill="url(#saffronH3)"/>

  <!-- ─── HOUSE ILLUSTRATION ─── -->
  <!-- Ground shadow -->
  <ellipse cx="220" cy="358" rx="130" ry="14" fill="rgba(0,0,0,0.55)"/>

  <!-- House wall -->
  <rect x="110" y="218" width="220" height="138" rx="8" fill="url(#wallGrad)" stroke="rgba(59,155,232,0.3)" stroke-width="1.2" filter="url(#houseShadow)"/>

  <!-- Roof -->
  <polygon points="95,222 220,128 345,222" fill="url(#roofGrad)" stroke="rgba(255,107,0,0.5)" stroke-width="1.8"/>
  <!-- Roof saffron highlight -->
  <line x1="95" y1="222" x2="220" y2="128" stroke="#FF8800" stroke-width="2"/>
  <line x1="220" y1="128" x2="345" y2="222" stroke="#FF8800" stroke-width="2"/>
  <!-- Roof peak accent -->
  <polygon points="208,128 220,112 232,128" fill="url(#saffron3)"/>
  <!-- Chimney -->
  <rect x="275" y="148" width="20" height="36" rx="4" fill="rgba(12,22,55,0.9)" stroke="rgba(59,155,232,0.3)" stroke-width="1"/>

  <!-- Window Left -->
  <rect x="126" y="240" width="58" height="52" rx="8" fill="rgba(255,107,0,0.1)" stroke="rgba(255,107,0,0.45)" stroke-width="1.2"/>
  <line x1="155" y1="240" x2="155" y2="292" stroke="rgba(255,107,0,0.3)" stroke-width="1"/>
  <line x1="126" y1="266" x2="184" y2="266" stroke="rgba(255,107,0,0.3)" stroke-width="1"/>
  <!-- Window glow warm -->
  <rect x="128" y="242" width="25" height="22" rx="4" fill="rgba(255,180,60,0.18)"/>
  <rect x="157" y="242" width="25" height="22" rx="4" fill="rgba(255,160,40,0.14)"/>

  <!-- Window Right -->
  <rect x="256" y="240" width="58" height="52" rx="8" fill="rgba(59,155,232,0.1)" stroke="rgba(59,155,232,0.38)" stroke-width="1.2"/>
  <line x1="285" y1="240" x2="285" y2="292" stroke="rgba(59,155,232,0.25)" stroke-width="1"/>
  <line x1="256" y1="266" x2="314" y2="266" stroke="rgba(59,155,232,0.25)" stroke-width="1"/>
  <rect x="258" y="242" width="25" height="22" rx="4" fill="rgba(100,180,255,0.12)"/>
  <rect x="287" y="242" width="25" height="22" rx="4" fill="rgba(80,160,240,0.1)"/>

  <!-- Door -->
  <rect x="193" y="280" width="54" height="76" rx="8" fill="rgba(255,107,0,0.18)" stroke="rgba(255,107,0,0.5)" stroke-width="1.3"/>
  <!-- Door arch -->
  <path d="M193,288 Q220,265 247,288" fill="none" stroke="rgba(255,107,0,0.55)" stroke-width="1.2"/>
  <!-- Door handle -->
  <circle cx="238" cy="320" r="3.5" fill="#FF9500"/>
  <!-- Door panel lines -->
  <rect x="200" y="300" width="16" height="20" rx="3" fill="rgba(255,107,0,0.08)" stroke="rgba(255,107,0,0.2)" stroke-width="0.7"/>
  <rect x="224" y="300" width="16" height="20" rx="3" fill="rgba(255,107,0,0.08)" stroke="rgba(255,107,0,0.2)" stroke-width="0.7"/>

  <!-- ─── PHLEBOTOMIST ─── -->
  <g filter="url(#personShadow)">
    <!-- Shadow -->
    <ellipse cx="72" cy="358" rx="38" ry="8" fill="rgba(0,0,0,0.5)"/>

    <!-- Legs -->
    <rect x="52" y="312" width="18" height="44" rx="9" fill="#0E1830"/>
    <rect x="74" y="312" width="18" height="44" rx="9" fill="#0E1830"/>
    <!-- Shoes -->
    <ellipse cx="61" cy="358" rx="14" ry="7" fill="#060C18"/>
    <ellipse cx="83" cy="358" rx="14" ry="7" fill="#060C18"/>

    <!-- Coat body -->
    <rect x="44" y="242" width="56" height="76" rx="14" fill="#1C2D5E" stroke="rgba(255,107,0,0.25)" stroke-width="1"/>
    <!-- Coat lapel detail -->
    <path d="M62,246 Q72,258 82,246" fill="none" stroke="#FFAA00" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Red cross badge -->
    <rect x="56" y="264" width="16" height="16" rx="4" fill="rgba(220,50,50,0.2)" stroke="rgba(220,50,50,0.5)" stroke-width="0.8"/>
    <line x1="64" y1="267" x2="64" y2="277" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="59" y1="272" x2="69" y2="272" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms -->
    <rect x="28" y="252" width="18" height="46" rx="9" fill="url(#skinGrad)"/>
    <rect x="98" y="252" width="18" height="46" rx="9" fill="#1C2D5E"/>

    <!-- Medical bag -->
    <rect x="110" y="274" width="42" height="36" rx="9" fill="rgba(255,107,0,0.22)" stroke="rgba(255,107,0,0.55)" stroke-width="1.2"/>
    <!-- Bag strap -->
    <rect x="120" y="268" width="22" height="9" rx="4.5" fill="rgba(255,107,0,0.28)" stroke="rgba(255,107,0,0.5)" stroke-width="0.8"/>
    <!-- Bag cross -->
    <line x1="131" y1="280" x2="131" y2="302" stroke="#FF9500" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="122" y1="291" x2="140" y2="291" stroke="#FF9500" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="72" cy="226" r="24" fill="url(#skinGrad)"/>
    <!-- Hair -->
    <path d="M48,220 Q50,202 72,200 Q94,202 96,220" fill="#2A1400"/>
    <!-- Eyes -->
    <ellipse cx="65" cy="226" rx="3" ry="3.5" fill="#1A0800"/>
    <ellipse cx="79" cy="226" rx="3" ry="3.5" fill="#1A0800"/>
    <!-- Smile -->
    <path d="M64,234 Q72,241 80,234" fill="none" stroke="#1A0800" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Mask -->
    <rect x="57" y="232" width="30" height="16" rx="8" fill="rgba(255,255,255,0.92)" stroke="rgba(28,45,94,0.35)" stroke-width="0.5"/>
    <!-- Cap -->
    <rect x="48" y="205" width="48" height="10" rx="5" fill="#1C2D5E" stroke="rgba(255,107,0,0.3)" stroke-width="0.8"/>
    <ellipse cx="72" cy="208" rx="26" ry="8" fill="#1C2D5E"/>
    <!-- Cap cross -->
    <line x1="72" y1="208" x2="72" y2="215" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="211" x2="76" y2="211" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ─── RIGHT STAT CARDS ─── -->
  <!-- Card 1: Patients -->
  <rect x="368" y="28" width="164" height="76" rx="18" fill="rgba(8,14,35,0.88)" stroke="rgba(255,107,0,0.38)" stroke-width="1.2" filter="url(#glowSaff3)"/>
  <rect x="369" y="29" width="162" height="28" rx="17" fill="rgba(255,107,0,0.09)"/>
  <text x="392" y="60" font-size="24">😊</text>
  <text x="430" y="56" font-family="system-ui,sans-serif" font-size="22" fill="white" font-weight="900">10K+</text>
  <text x="392" y="78" font-family="system-ui,sans-serif" font-size="8" fill="rgba(255,160,0,0.75)">Happy patients served</text>
  <!-- Stars -->
  <text x="392" y="94" font-family="system-ui,sans-serif" font-size="10" fill="#FFD700">★★★★★</text>
  <text x="448" y="94" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(255,255,255,0.4)">4.9/5</text>

  <!-- Card 2: Areas -->
  <rect x="368" y="118" width="164" height="68" rx="18" fill="rgba(8,14,35,0.88)" stroke="rgba(59,155,232,0.32)" stroke-width="1.2" filter="url(#chipShadow3)"/>
  <rect x="369" y="119" width="162" height="24" rx="17" fill="rgba(59,155,232,0.07)"/>
  <text x="392" y="150" font-size="22">📍</text>
  <text x="428" y="148" font-family="system-ui,sans-serif" font-size="20" fill="white" font-weight="900">25+</text>
  <text x="392" y="166" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(100,180,255,0.7)">Areas in Pune covered</text>
  <text x="392" y="178" font-family="system-ui,sans-serif" font-size="6.5" fill="rgba(255,255,255,0.28)">Kothrud · Baner · Hinjewadi +22</text>

  <!-- Card 3: NABL -->
  <rect x="368" y="200" width="164" height="68" rx="18" fill="rgba(8,14,35,0.88)" stroke="rgba(0,229,137,0.3)" stroke-width="1.2" filter="url(#chipShadow3)"/>
  <rect x="369" y="201" width="162" height="24" rx="17" fill="rgba(0,229,137,0.06)"/>
  <text x="392" y="232" font-size="22">🏅</text>
  <text x="425" y="230" font-family="system-ui,sans-serif" font-size="9.5" fill="white" font-weight="800">NABL Certified</text>
  <text x="392" y="248" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(0,229,137,0.7)">Partner labs · ISO 9001</text>
  <text x="392" y="260" font-family="system-ui,sans-serif" font-size="6.5" fill="rgba(255,255,255,0.28)">Thyrocare · Metropolis</text>

  <!-- ─── BOTTOM FEATURE STRIP ─── -->
  <rect x="28" y="298" width="320" height="78" rx="18" fill="rgba(0,0,0,0.4)" stroke="rgba(255,107,0,0.16)" stroke-width="1"/>

  <!-- Feature icons row — evenly spaced, text centered under each -->
  <!-- F1 -->
  <circle cx="72" cy="330" r="20" fill="rgba(255,107,0,0.14)" stroke="rgba(255,107,0,0.35)" stroke-width="1.2"/>
  <text x="72" y="336" text-anchor="middle" font-size="16">🌅</text>
  <text x="72" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(255,160,0,0.8)" font-weight="700">7 AM</text>
  <text x="72" y="366" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.4)">Early Slots</text>

  <line x1="110" y1="312" x2="110" y2="368" stroke="rgba(255,107,0,0.12)" stroke-width="1"/>

  <!-- F2 -->
  <circle cx="152" cy="330" r="20" fill="rgba(59,155,232,0.14)" stroke="rgba(59,155,232,0.35)" stroke-width="1.2"/>
  <text x="152" y="336" text-anchor="middle" font-size="16">💉</text>
  <text x="152" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(100,180,255,0.8)" font-weight="700">Trained</text>
  <text x="152" y="366" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.4)">Phlebotomist</text>

  <line x1="190" y1="312" x2="190" y2="368" stroke="rgba(255,107,0,0.12)" stroke-width="1"/>

  <!-- F3 -->
  <circle cx="232" cy="330" r="20" fill="rgba(0,229,137,0.12)" stroke="rgba(0,229,137,0.32)" stroke-width="1.2"/>
  <text x="232" y="336" text-anchor="middle" font-size="16">💳</text>
  <text x="232" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(0,229,137,0.8)" font-weight="700">Zero Extra</text>
  <text x="232" y="366" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.4)">Visit Charge</text>

  <line x1="270" y1="312" x2="270" y2="368" stroke="rgba(255,107,0,0.12)" stroke-width="1"/>

  <!-- F4 -->
  <circle cx="312" cy="330" r="20" fill="rgba(255,107,0,0.12)" stroke="rgba(255,107,0,0.3)" stroke-width="1.2"/>
  <text x="312" y="336" text-anchor="middle" font-size="16">📱</text>
  <text x="312" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(255,160,0,0.8)" font-weight="700">WhatsApp</text>
  <text x="312" y="366" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.4)">Booking</text>

  <!-- ─── EXTRA RIGHT CARDS ─── -->
  <rect x="368" y="282" width="164" height="52" rx="16" fill="rgba(8,14,35,0.88)" stroke="rgba(255,107,0,0.25)" stroke-width="1.1" filter="url(#chipShadow3)"/>
  <text x="392" y="310" font-size="20">🚀</text>
  <text x="425" y="308" font-family="system-ui,sans-serif" font-size="9.5" fill="white" font-weight="800">Quick Booking</text>
  <text x="392" y="324" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(255,160,0,0.65)">Confirmed in 2 minutes</text>

  <rect x="368" y="348" width="164" height="38" rx="14" fill="rgba(8,14,35,0.88)" stroke="rgba(255,215,0,0.25)" stroke-width="1"/>
  <text x="392" y="370" font-family="system-ui,sans-serif" font-size="12" fill="#FFD700">★★★★★</text>
  <text x="450" y="370" font-family="system-ui,sans-serif" font-size="8" fill="rgba(255,255,255,0.45)">4.9 / 5</text>

  <!-- Left saffron accent bar -->
  <rect x="0" y="30" width="5" height="85" rx="2.5" fill="url(#saffron3)" opacity="0.7"/>
  <rect x="8" y="46" width="3" height="54" rx="1.5" fill="#FFAA00" opacity="0.3"/>
</svg>
