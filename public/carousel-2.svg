<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010D09"/>
      <stop offset="55%" stop-color="#021A0F"/>
      <stop offset="100%" stop-color="#062414"/>
    </linearGradient>
    <linearGradient id="saffron2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="saffronH2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="green2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E589"/>
      <stop offset="100%" stop-color="#00B868"/>
    </linearGradient>
    <linearGradient id="reportCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#041A0D"/>
      <stop offset="100%" stop-color="#021008"/>
    </linearGradient>
    <linearGradient id="barA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF4400"/>
    </linearGradient>
    <linearGradient id="barB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>
    <linearGradient id="barC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E589"/>
      <stop offset="100%" stop-color="#00A860"/>
    </linearGradient>
    <linearGradient id="chartLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#00E589"/>
    </linearGradient>
    <radialGradient id="orbG" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#00E589" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00E589" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbS" cx="20%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow2">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="chipShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#00E589" flood-opacity="0.2"/>
    </filter>
    <filter id="saffGlow2">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#FF6B00" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="560" height="400" fill="url(#bg2)"/>
  <rect width="560" height="400" fill="url(#orbG)"/>
  <rect width="560" height="400" fill="url(#orbS)"/>

  <!-- Geometric lines -->
  <line x1="560" y1="0" x2="360" y2="400" stroke="rgba(0,229,137,0.04)" stroke-width="1.5"/>
  <line x1="500" y1="0" x2="300" y2="400" stroke="rgba(0,229,137,0.025)" stroke-width="1"/>
  <line x1="0" y1="350" x2="400" y2="0" stroke="rgba(255,107,0,0.03)" stroke-width="1"/>

  <!-- Top saffron bar -->
  <rect x="0" y="0" width="560" height="3" fill="url(#saffronH2)"/>

  <!-- ─── MAIN REPORT CARD ─── -->
  <rect x="28" y="28" width="308" height="228" rx="22" fill="url(#reportCard)" filter="url(#cardShadow2)"/>
  <rect x="28" y="28" width="308" height="228" rx="22" fill="none" stroke="rgba(0,229,137,0.3)" stroke-width="1.3"/>

  <!-- Card header band -->
  <rect x="28" y="28" width="308" height="48" rx="22" fill="rgba(0,229,137,0.1)"/>
  <rect x="28" y="56" width="308" height="20" fill="rgba(0,229,137,0.06)"/>

  <!-- Report icon -->
  <text x="50" y="60" font-size="22">📋</text>
  <!-- Report title -->
  <text x="80" y="52" font-family="system-ui,sans-serif" font-size="8.5" fill="rgba(0,229,137,0.75)" font-weight="800" letter-spacing="0.8">DIAGNOSTIC REPORT</text>
  <text x="80" y="65" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.38)">Rajesh Kumar · 14 May 2026</text>

  <!-- NABL badge top-right of card -->
  <rect x="292" y="34" width="36" height="16" rx="8" fill="rgba(255,107,0,0.25)" stroke="rgba(255,107,0,0.55)" stroke-width="0.8"/>
  <text x="310" y="45" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" fill="#FFAA00" font-weight="800">NABL✓</text>

  <!-- RESULT ROWS -->
  <!-- Row 1: Haemoglobin -->
  <rect x="38" y="88" width="288" height="32" rx="9" fill="rgba(255,255,255,0.03)"/>
  <text x="52" y="108" font-family="system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.78)">Haemoglobin</text>
  <rect x="214" y="93" width="66" height="18" rx="9" fill="rgba(0,229,137,0.18)"/>
  <text x="247" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#00E589" font-weight="700">14.2 g/dL</text>
  <text x="290" y="106" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(0,229,137,0.7)" font-weight="700">✓ Normal</text>

  <!-- Row 2: Fasting Glucose -->
  <rect x="38" y="126" width="288" height="32" rx="9" fill="rgba(255,255,255,0.025)"/>
  <text x="52" y="146" font-family="system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.78)">Fasting Glucose</text>
  <rect x="214" y="131" width="66" height="18" rx="9" fill="rgba(255,107,0,0.2)"/>
  <text x="247" y="143" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#FFAA00" font-weight="700">108 mg/dL</text>
  <text x="290" y="144" font-family="system-ui,sans-serif" font-size="7.5" fill="#FFAA00" font-weight="700">⚠ Border</text>

  <!-- Row 3: TSH -->
  <rect x="38" y="164" width="288" height="32" rx="9" fill="rgba(255,255,255,0.03)"/>
  <text x="52" y="184" font-family="system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.78)">TSH (Thyroid)</text>
  <rect x="214" y="169" width="66" height="18" rx="9" fill="rgba(0,229,137,0.18)"/>
  <text x="247" y="181" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#00E589" font-weight="700">2.4 mIU/L</text>
  <text x="290" y="182" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(0,229,137,0.7)" font-weight="700">✓ Normal</text>

  <!-- Row 4: Vitamin D -->
  <rect x="38" y="202" width="288" height="32" rx="9" fill="rgba(255,255,255,0.025)"/>
  <text x="52" y="222" font-family="system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.78)">Vitamin D</text>
  <rect x="214" y="207" width="66" height="18" rx="9" fill="rgba(255,160,0,0.18)"/>
  <text x="247" y="219" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#FFCC44" font-weight="700">18 ng/mL</text>
  <text x="290" y="220" font-family="system-ui,sans-serif" font-size="7.5" fill="#FFCC44" font-weight="700">↓ Low</text>

  <!-- ─── TREND CHART CARD ─── -->
  <rect x="28" y="270" width="200" height="110" rx="18" fill="rgba(2,15,9,0.85)" stroke="rgba(255,107,0,0.28)" stroke-width="1.2" filter="url(#saffGlow2)"/>
  <text x="48" y="293" font-family="system-ui,sans-serif" font-size="8" fill="rgba(255,160,0,0.8)" font-weight="800" letter-spacing="0.5">TREND ANALYSIS</text>

  <!-- Chart bars -->
  <rect x="44" y="333" width="18" height="38" rx="5" fill="url(#barA)" opacity="0.85"/>
  <rect x="68" y="325" width="18" height="46" rx="5" fill="url(#barB)" opacity="0.85"/>
  <rect x="92" y="316" width="18" height="55" rx="5" fill="url(#barB)" opacity="0.85"/>
  <rect x="116" y="308" width="18" height="63" rx="5" fill="url(#barC)" opacity="0.85"/>
  <rect x="140" y="312" width="18" height="59" rx="5" fill="url(#barC)" opacity="0.85"/>
  <rect x="164" y="304" width="18" height="67" rx="5" fill="url(#barC)" opacity="0.95"/>

  <!-- Chart line -->
  <polyline points="53,333 77,325 101,316 125,308 149,312 173,304" stroke="url(#chartLine2)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="53" cy="333" r="3.5" fill="#FF6B00"/>
  <circle cx="77" cy="325" r="3.5" fill="#FF9500"/>
  <circle cx="101" cy="316" r="3.5" fill="#FFAA00"/>
  <circle cx="125" cy="308" r="3.5" fill="#00E589"/>
  <circle cx="149" cy="312" r="3.5" fill="#00E589"/>
  <circle cx="173" cy="304" r="4.5" fill="#00E589" stroke="rgba(0,229,137,0.4)" stroke-width="2"/>

  <!-- ─── 24HR DELIVERY CARD ─── -->
  <rect x="244" y="270" width="164" height="110" rx="18" fill="rgba(2,15,9,0.85)" stroke="rgba(0,229,137,0.35)" stroke-width="1.2" filter="url(#chipShadow)"/>

  <!-- Big emoji + number -->
  <text x="326" y="308" text-anchor="middle" font-size="28">⚡</text>
  <text x="326" y="336" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" fill="white" font-weight="900">24 hrs</text>
  <text x="326" y="352" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="rgba(0,229,137,0.75)">guaranteed delivery</text>
  <!-- progress bar -->
  <rect x="268" y="360" width="116" height="7" rx="3.5" fill="rgba(0,229,137,0.12)"/>
  <rect x="268" y="360" width="96" height="7" rx="3.5" fill="url(#green2)"/>

  <!-- ─── RIGHT SIDE CHIPS ─── -->
  <!-- Chip 1: Report Ready -->
  <rect x="352" y="28" width="180" height="52" rx="15" fill="rgba(0,229,137,0.1)" stroke="rgba(0,229,137,0.38)" stroke-width="1.2" filter="url(#chipShadow)"/>
  <text x="374" y="52" font-size="20">✅</text>
  <text x="406" y="48" font-family="system-ui,sans-serif" font-size="9.5" fill="white" font-weight="800">Report Ready!</text>
  <text x="406" y="62" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(0,229,137,0.65)">Delivered to email</text>

  <!-- Chip 2: NABL -->
  <rect x="352" y="92" width="180" height="52" rx="15" fill="rgba(255,107,0,0.1)" stroke="rgba(255,107,0,0.35)" stroke-width="1.2" filter="url(#saffGlow2)"/>
  <text x="374" y="116" font-size="20">🏆</text>
  <text x="406" y="112" font-family="system-ui,sans-serif" font-size="9.5" fill="white" font-weight="800">NABL Certified</text>
  <text x="406" y="126" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(255,160,0,0.7)">ISO 9001:2015</text>

  <!-- Chip 3: Email PDF -->
  <rect x="352" y="156" width="180" height="52" rx="15" fill="rgba(59,155,232,0.1)" stroke="rgba(59,155,232,0.32)" stroke-width="1.2"/>
  <text x="374" y="180" font-size="20">📧</text>
  <text x="406" y="176" font-family="system-ui,sans-serif" font-size="9.5" fill="white" font-weight="800">Email + PDF</text>
  <text x="406" y="190" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(100,180,255,0.65)">Instant delivery</text>

  <!-- Chip 4: Accuracy -->
  <rect x="352" y="220" width="180" height="52" rx="15" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.3)" stroke-width="1.2"/>
  <text x="374" y="244" font-size="20">🔒</text>
  <text x="406" y="240" font-family="system-ui,sans-serif" font-size="9.5" fill="white" font-weight="800">100% Accurate</text>
  <text x="406" y="254" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(167,139,250,0.65)">Quality assured</text>

  <!-- Chip 5: Thyrocare / Metropolis -->
  <rect x="352" y="284" width="180" height="52" rx="15" fill="rgba(255,107,0,0.08)" stroke="rgba(255,107,0,0.25)" stroke-width="1.2"/>
  <text x="374" y="308" font-size="20">🤝</text>
  <text x="406" y="304" font-family="system-ui,sans-serif" font-size="9.5" fill="white" font-weight="800">Partner Labs</text>
  <text x="406" y="318" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(255,160,0,0.65)">Thyrocare · Metropolis</text>

  <!-- Chip 6: Star rating -->
  <rect x="352" y="348" width="180" height="38" rx="14" fill="rgba(255,215,0,0.08)" stroke="rgba(255,215,0,0.25)" stroke-width="1"/>
  <text x="374" y="371" font-family="system-ui,sans-serif" font-size="14" fill="#FFD700">★★★★★</text>
  <text x="430" y="371" font-family="system-ui,sans-serif" font-size="8" fill="rgba(255,255,255,0.5)">4.9 / 5</text>

  <!-- Accent bar right edge -->
  <rect x="555" y="30" width="5" height="80" rx="2.5" fill="url(#green2)" opacity="0.55"/>
  <rect x="547" y="46" width="3" height="52" rx="1.5" fill="url(#saffron2)" opacity="0.3"/>
</svg>
