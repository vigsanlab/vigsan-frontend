<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12060A"/>
      <stop offset="50%" stop-color="#1E0C00"/>
      <stop offset="100%" stop-color="#2A1200"/>
    </linearGradient>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="saffronH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A1800"/>
      <stop offset="100%" stop-color="#150C00"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E0700"/>
      <stop offset="100%" stop-color="#1A0E00"/>
    </linearGradient>
    <radialGradient id="orbR" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbL" cx="15%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
    <filter id="phoneShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="badgeGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#FF6B00" flood-opacity="0.28"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="560" height="400" fill="url(#bg1)"/>
  <rect width="560" height="400" fill="url(#orbR)"/>
  <rect width="560" height="400" fill="url(#orbL)"/>

  <!-- Geometric accent lines (no dots) -->
  <line x1="0" y1="0" x2="180" y2="400" stroke="rgba(255,107,0,0.04)" stroke-width="1.5"/>
  <line x1="50" y1="0" x2="230" y2="400" stroke="rgba(255,107,0,0.025)" stroke-width="1"/>
  <line x1="560" y1="50" x2="320" y2="400" stroke="rgba(255,107,0,0.03)" stroke-width="1"/>

  <!-- Top saffron bar -->
  <rect x="0" y="0" width="560" height="3" fill="url(#saffronH)"/>

  <!-- ─── PHONE ─── -->
  <rect x="318" y="52" width="132" height="278" rx="24" fill="url(#phoneBody)" filter="url(#phoneShadow)"/>
  <rect x="318" y="52" width="132" height="278" rx="24" fill="none" stroke="rgba(255,140,0,0.5)" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="325" y="66" width="118" height="244" rx="15" fill="url(#screenBg)"/>

  <!-- Status bar -->
  <rect x="325" y="66" width="118" height="22" rx="15" fill="rgba(0,0,0,0.2)"/>
  <text x="334" y="80" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,180,60,0.65)" font-weight="600">9:41</text>
  <text x="436" y="80" text-anchor="end" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,180,60,0.55)">■■■</text>
  <!-- Pill notch -->
  <rect x="356" y="66" width="56" height="12" rx="6" fill="#0E0700"/>

  <!-- App header -->
  <rect x="325" y="88" width="118" height="24" fill="rgba(255,107,0,0.2)"/>
  <text x="384" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#FFAA00" font-weight="800" letter-spacing="0.8">VIGSAN</text>

  <!-- Search bar -->
  <rect x="330" y="116" width="108" height="14" rx="7" fill="rgba(255,255,255,0.05)" stroke="rgba(255,120,0,0.3)" stroke-width="0.8"/>
  <text x="338" y="126.5" font-family="system-ui,sans-serif" font-size="6" fill="rgba(255,255,255,0.28)">Search tests...</text>

  <!-- Section label -->
  <text x="330" y="142" font-family="system-ui,sans-serif" font-size="5.5" fill="rgba(255,160,0,0.65)" font-weight="700" letter-spacing="0.8">POPULAR TESTS</text>

  <!-- Card 1: CBC -->
  <rect x="330" y="148" width="50" height="50" rx="10" fill="rgba(255,100,0,0.22)" stroke="rgba(255,100,0,0.45)" stroke-width="0.9"/>
  <text x="355" y="169" text-anchor="middle" font-size="15">🩸</text>
  <text x="355" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" fill="rgba(255,255,255,0.9)" font-weight="700">CBC</text>
  <text x="355" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6" fill="#FFAA00">₹299</text>

  <!-- Card 2: Thyroid -->
  <rect x="385" y="148" width="50" height="50" rx="10" fill="rgba(255,160,0,0.16)" stroke="rgba(255,160,0,0.38)" stroke-width="0.9"/>
  <text x="410" y="169" text-anchor="middle" font-size="15">🦋</text>
  <text x="410" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" fill="rgba(255,255,255,0.9)" font-weight="700">Thyroid</text>
  <text x="410" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6" fill="#FFAA00">₹399</text>

  <!-- Full body package -->
  <rect x="330" y="203" width="108" height="36" rx="9" fill="rgba(255,107,0,0.2)" stroke="rgba(255,130,0,0.45)" stroke-width="0.9"/>
  <text x="338" y="218" font-family="system-ui,sans-serif" font-size="7" fill="white" font-weight="700">Full Body Checkup</text>
  <text x="338" y="230" font-family="system-ui,sans-serif" font-size="5.5" fill="rgba(255,200,100,0.7)">77 parameters</text>
  <text x="432" y="225" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#FFD700" font-weight="900">₹799</text>

  <!-- Book button -->
  <rect x="330" y="245" width="108" height="22" rx="11" fill="url(#saffron)"/>
  <text x="384" y="259.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="white" font-weight="800">Book Now  →</text>

  <!-- Confirmed chip -->
  <rect x="330" y="273" width="108" height="18" rx="9" fill="rgba(29,185,84,0.2)" stroke="rgba(29,185,84,0.5)" stroke-width="0.8"/>
  <text x="384" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" fill="#4ADE80" font-weight="700">✓ Slot confirmed — 7 AM</text>

  <!-- Home bar -->
  <rect x="355" y="300" width="58" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Phone ground ellipse -->
  <ellipse cx="384" cy="342" rx="66" ry="9" fill="rgba(0,0,0,0.4)"/>

  <!-- ─── LEFT BADGES ─── -->
  <!-- Badge 1 -->
  <rect x="24" y="72" width="136" height="62" rx="18" fill="rgba(20,10,0,0.75)" stroke="rgba(255,107,0,0.45)" stroke-width="1.2" filter="url(#badgeGlow)"/>
  <rect x="25" y="73" width="134" height="25" rx="17" fill="rgba(255,107,0,0.1)"/>
  <text x="50" y="101" font-size="24">⚡</text>
  <text x="84" y="99" font-family="system-ui,sans-serif" font-size="18" fill="white" font-weight="900">2 min</text>
  <text x="84" y="115" font-family="system-ui,sans-serif" font-size="8.5" fill="rgba(255,180,60,0.9)">to book any test</text>
  <!-- Connector -->
  <circle cx="160" cy="103" r="3.5" fill="#FF6B00" opacity="0.7"/>
  <line x1="163" y1="103" x2="317" y2="168" stroke="rgba(255,107,0,0.14)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Badge 2 -->
  <rect x="24" y="154" width="136" height="62" rx="18" fill="rgba(20,10,0,0.75)" stroke="rgba(255,160,0,0.4)" stroke-width="1.2" filter="url(#badgeGlow)"/>
  <rect x="25" y="155" width="134" height="25" rx="17" fill="rgba(255,150,0,0.08)"/>
  <text x="50" y="183" font-size="24">🔬</text>
  <text x="84" y="181" font-family="system-ui,sans-serif" font-size="18" fill="white" font-weight="900">1000+</text>
  <text x="84" y="197" font-family="system-ui,sans-serif" font-size="8.5" fill="rgba(255,180,60,0.9)">tests available</text>
  <circle cx="160" cy="185" r="3.5" fill="#FF9500" opacity="0.7"/>
  <line x1="163" y1="185" x2="317" y2="222" stroke="rgba(255,107,0,0.12)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Badge 3 -->
  <rect x="24" y="236" width="136" height="62" rx="18" fill="rgba(20,10,0,0.75)" stroke="rgba(255,107,0,0.38)" stroke-width="1.2" filter="url(#badgeGlow)"/>
  <rect x="25" y="237" width="134" height="25" rx="17" fill="rgba(255,107,0,0.08)"/>
  <text x="50" y="265" font-size="24">🏠</text>
  <text x="84" y="263" font-family="system-ui,sans-serif" font-size="18" fill="white" font-weight="900">Free</text>
  <text x="84" y="279" font-family="system-ui,sans-serif" font-size="8.5" fill="rgba(255,180,60,0.9)">home collection</text>
  <circle cx="160" cy="267" r="3.5" fill="#FF6B00" opacity="0.6"/>
  <line x1="163" y1="267" x2="317" y2="252" stroke="rgba(255,107,0,0.12)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ─── STEP BAR BOTTOM ─── -->
  <rect x="24" y="318" width="272" height="62" rx="18" fill="rgba(0,0,0,0.38)" stroke="rgba(255,107,0,0.2)" stroke-width="1"/>

  <!-- Step 1 (active) -->
  <circle cx="62" cy="349" r="17" fill="url(#saffron)" filter="url(#softGlow)"/>
  <text x="62" y="354.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="white" font-weight="900">1</text>
  <text x="62" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" fill="rgba(255,180,60,0.95)" font-weight="700">Choose</text>

  <line x1="82" y1="349" x2="108" y2="349" stroke="rgba(255,107,0,0.5)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Step 2 -->
  <circle cx="126" cy="349" r="15" fill="rgba(255,107,0,0.2)" stroke="rgba(255,107,0,0.55)" stroke-width="1.3"/>
  <text x="126" y="354.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" font-weight="800">2</text>
  <text x="126" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" fill="rgba(255,255,255,0.45)" font-weight="600">Book</text>

  <line x1="144" y1="349" x2="170" y2="349" stroke="rgba(255,107,0,0.3)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Step 3 -->
  <circle cx="188" cy="349" r="15" fill="rgba(255,107,0,0.1)" stroke="rgba(255,107,0,0.3)" stroke-width="1"/>
  <text x="188" y="354.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" font-weight="700">3</text>
  <text x="188" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" fill="rgba(255,255,255,0.28)" font-weight="600">Pickup</text>

  <line x1="206" y1="349" x2="232" y2="349" stroke="rgba(255,107,0,0.18)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Step 4 -->
  <circle cx="250" cy="349" r="15" fill="rgba(255,107,0,0.06)" stroke="rgba(255,107,0,0.18)" stroke-width="1"/>
  <text x="250" y="354.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.2)" font-weight="700">4</text>
  <text x="250" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" fill="rgba(255,255,255,0.18)" font-weight="600">Report</text>

  <!-- Left saffron vertical accent -->
  <rect x="0" y="28" width="5" height="88" rx="2.5" fill="url(#saffron)" opacity="0.75"/>
  <rect x="8" y="44" width="3" height="58" rx="1.5" fill="url(#gold)" opacity="0.35"/>
</svg>
