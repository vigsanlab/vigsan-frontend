<svg viewBox="0 0 360 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010D09"/>
      <stop offset="55%" stop-color="#021A0F"/>
      <stop offset="100%" stop-color="#062414"/>
    </linearGradient>
    <linearGradient id="saff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="saffH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E589"/>
      <stop offset="100%" stop-color="#00B868"/>
    </linearGradient>
    <linearGradient id="reportCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#041A0D"/>
      <stop offset="100%" stop-color="#021008"/>
    </linearGradient>
    <linearGradient id="barA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF4400"/>
    </linearGradient>
    <linearGradient id="barB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>
    <linearGradient id="barC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E589"/>
      <stop offset="100%" stop-color="#00A860"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#00E589"/>
    </linearGradient>
    <radialGradient id="orbG" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#00E589" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00E589" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbS" cx="20%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="chipShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#00E589" flood-opacity="0.18"/>
    </filter>
    <filter id="saffGlow">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#FF6B00" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="360" height="440" fill="url(#bg)"/>
  <rect width="360" height="440" fill="url(#orbG)"/>
  <rect width="360" height="440" fill="url(#orbS)"/>

  <!-- Geometric lines -->
  <line x1="360" y1="0" x2="220" y2="440" stroke="rgba(0,229,137,0.04)" stroke-width="1.5"/>
  <line x1="0" y1="360" x2="300" y2="0" stroke="rgba(255,107,0,0.03)" stroke-width="1"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="360" height="3" fill="url(#saffH)"/>

  <!-- ── HEADER CHIPS ROW ── -->
  <!-- Report Ready -->
  <rect x="16" y="14" width="148" height="46" rx="13" fill="rgba(0,229,137,0.1)" stroke="rgba(0,229,137,0.38)" stroke-width="1.1" filter="url(#chipShadow)"/>
  <text x="34" y="38" font-size="18">✅</text>
  <text x="60" y="34" font-family="system-ui,sans-serif" font-size="9" fill="white" font-weight="800">Report Ready!</text>
  <text x="60" y="48" font-family="system-ui,sans-serif" font-size="7" fill="rgba(0,229,137,0.65)">Delivered to email</text>

  <!-- NABL -->
  <rect x="176" y="14" width="168" height="46" rx="13" fill="rgba(255,107,0,0.1)" stroke="rgba(255,107,0,0.35)" stroke-width="1.1" filter="url(#saffGlow)"/>
  <text x="194" y="38" font-size="18">🏆</text>
  <text x="222" y="34" font-family="system-ui,sans-serif" font-size="9" fill="white" font-weight="800">NABL Certified</text>
  <text x="222" y="48" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,160,0,0.7)">ISO 9001:2015</text>

  <!-- ── REPORT CARD (main) ── -->
  <rect x="16" y="74" width="328" height="190" rx="20" fill="url(#reportCard)" filter="url(#cardShadow)"/>
  <rect x="16" y="74" width="328" height="190" rx="20" fill="none" stroke="rgba(0,229,137,0.3)" stroke-width="1.2"/>

  <!-- Card header band -->
  <rect x="16" y="74" width="328" height="42" rx="20" fill="rgba(0,229,137,0.1)"/>
  <rect x="16" y="98" width="328" height="18" fill="rgba(0,229,137,0.06)"/>

  <text x="38" y="100" font-size="20">📋</text>
  <text x="66" y="94" font-family="system-ui,sans-serif" font-size="8.5" fill="rgba(0,229,137,0.75)" font-weight="800" letter-spacing="0.8">DIAGNOSTIC REPORT</text>
  <text x="66" y="107" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.38)">Rajesh Kumar · 14 May 2026</text>
  <!-- NABL pill -->
  <rect x="300" y="80" width="36" height="15" rx="7.5" fill="rgba(255,107,0,0.25)" stroke="rgba(255,107,0,0.5)" stroke-width="0.8"/>
  <text x="318" y="90.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6" fill="#FFAA00" font-weight="800">NABL✓</text>

  <!-- Result row 1 -->
  <rect x="26" y="122" width="308" height="30" rx="8" fill="rgba(255,255,255,0.03)"/>
  <text x="40" y="141" font-family="system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.78)">Haemoglobin</text>
  <rect x="226" y="127" width="68" height="16" rx="8" fill="rgba(0,229,137,0.18)"/>
  <text x="260" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#00E589" font-weight="700">14.2 g/dL</text>
  <text x="302" y="139" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(0,229,137,0.7)" font-weight="700">✓ Normal</text>

  <!-- Result row 2 -->
  <rect x="26" y="157" width="308" height="30" rx="8" fill="rgba(255,255,255,0.025)"/>
  <text x="40" y="176" font-family="system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.78)">Fasting Glucose</text>
  <rect x="226" y="162" width="68" height="16" rx="8" fill="rgba(255,107,0,0.2)"/>
  <text x="260" y="173" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#FFAA00" font-weight="700">108 mg/dL</text>
  <text x="302" y="174" font-family="system-ui,sans-serif" font-size="7.5" fill="#FFAA00" font-weight="700">⚠ Border</text>

  <!-- Result row 3 -->
  <rect x="26" y="192" width="308" height="30" rx="8" fill="rgba(255,255,255,0.03)"/>
  <text x="40" y="211" font-family="system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.78)">TSH (Thyroid)</text>
  <rect x="226" y="197" width="68" height="16" rx="8" fill="rgba(0,229,137,0.18)"/>
  <text x="260" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#00E589" font-weight="700">2.4 mIU/L</text>
  <text x="302" y="209" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(0,229,137,0.7)" font-weight="700">✓ Normal</text>

  <!-- ── CHART + DELIVERY ROW ── -->
  <!-- Chart card -->
  <rect x="16" y="278" width="188" height="102" rx="16" fill="rgba(2,15,9,0.88)" stroke="rgba(255,107,0,0.28)" stroke-width="1.1" filter="url(#saffGlow)"/>
  <text x="34" y="298" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(255,160,0,0.8)" font-weight="800" letter-spacing="0.5">TREND</text>

  <!-- Chart bars -->
  <rect x="30" y="328" width="16" height="36" rx="4" fill="url(#barA)" opacity="0.85"/>
  <rect x="52" y="320" width="16" height="44" rx="4" fill="url(#barB)" opacity="0.85"/>
  <rect x="74" y="312" width="16" height="52" rx="4" fill="url(#barB)" opacity="0.85"/>
  <rect x="96" y="304" width="16" height="60" rx="4" fill="url(#barC)" opacity="0.85"/>
  <rect x="118" y="308" width="16" height="56" rx="4" fill="url(#barC)" opacity="0.85"/>
  <rect x="140" y="300" width="16" height="64" rx="4" fill="url(#barC)" opacity="0.95"/>

  <!-- Chart line -->
  <polyline points="38,328 60,320 82,312 104,304 126,308 148,300" stroke="url(#chartLine)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="38" cy="328" r="3" fill="#FF6B00"/>
  <circle cx="60" cy="320" r="3" fill="#FF9500"/>
  <circle cx="82" cy="312" r="3" fill="#FFAA00"/>
  <circle cx="104" cy="304" r="3" fill="#00E589"/>
  <circle cx="126" cy="308" r="3" fill="#00E589"/>
  <circle cx="148" cy="300" r="4" fill="#00E589" stroke="rgba(0,229,137,0.4)" stroke-width="2"/>

  <!-- Delivery card -->
  <rect x="216" y="278" width="128" height="102" rx="16" fill="rgba(2,15,9,0.88)" stroke="rgba(0,229,137,0.35)" stroke-width="1.1" filter="url(#chipShadow)"/>
  <text x="280" y="310" text-anchor="middle" font-size="26">⚡</text>
  <text x="280" y="336" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="white" font-weight="900">24hrs</text>
  <text x="280" y="352" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7.5" fill="rgba(0,229,137,0.75)">report delivery</text>
  <!-- progress bar -->
  <rect x="238" y="360" width="84" height="6" rx="3" fill="rgba(0,229,137,0.12)"/>
  <rect x="238" y="360" width="70" height="6" rx="3" fill="url(#green)"/>

  <!-- ── BOTTOM CHIPS ROW ── -->
  <rect x="16" y="392" width="154" height="36" rx="12" fill="rgba(59,155,232,0.1)" stroke="rgba(59,155,232,0.3)" stroke-width="1"/>
  <text x="34" y="414" font-size="16">📧</text>
  <text x="58" y="410" font-family="system-ui,sans-serif" font-size="9" fill="white" font-weight="700">Email + PDF</text>
  <text x="58" y="422" font-family="system-ui,sans-serif" font-size="7" fill="rgba(100,180,255,0.6)">Instant delivery</text>

  <rect x="182" y="392" width="162" height="36" rx="12" fill="rgba(255,215,0,0.08)" stroke="rgba(255,215,0,0.25)" stroke-width="1"/>
  <text x="200" y="414" font-family="system-ui,sans-serif" font-size="14" fill="#FFD700">★★★★★</text>
  <text x="254" y="414" font-family="system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">4.9 / 5</text>

  <!-- Left accent bar -->
  <rect x="0" y="28" width="5" height="80" rx="2.5" fill="url(#saff)" opacity="0.7"/>
</svg>